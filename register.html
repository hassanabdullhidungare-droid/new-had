<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H A D Chat - Rejista</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
--primary: #008069;
--secondary: #00695c;
--dark: #073042;
--text: #333;
--light: #f9f9f9;
--danger: #e53935;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
margin: 0;
padding: 0;
color: var(--text);
line-height: 1.6;
background: linear-gradient(135deg, #e0f7fa 0%, #ffffff 100%);
min-height: 100vh;
}
.register-container {
max-width: 450px;
margin: 40px auto;
padding: 30px;
background: white;
border-radius: 20px;
box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
.logo-area {
text-align: center;
margin-bottom: 25px;
}
.logo-area i {
font-size: 2.5em;
color: var(--primary);
}
.logo-area h2 {
color: var(--primary);
margin: 10px 0 5px;
}
.logo-area p {
color: #888;
font-size: 0.9em;
}
.profile-photo-area {
text-align: center;
margin-bottom: 20px;
}
.photo-circle {
width: 100px;
height: 100px;
border-radius: 50%;
background: #e0f7fa;
border: 3px dashed var(--primary);
display: inline-flex;
align-items: center;
justify-content: center;
cursor: pointer;
overflow: hidden;
position: relative;
transition: 0.3s;
}
.photo-circle:hover {
border-color: var(--secondary);
transform: scale(1.05);
}
.photo-circle img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 50%;
}
.photo-circle i {
font-size: 2em;
color: var(--primary);
}
.photo-circle input {
display: none;
}
.photo-hint {
font-size: 0.8em;
color: #999;
margin-top: 5px;
}
.form-group {
margin-bottom: 15px;
}
.form-group label {
display: block;
font-weight: 600;
margin-bottom: 5px;
font-size: 0.9em;
}
.form-group input, .form-group select {
width: 100%;
padding: 12px 15px;
border: 2px solid #e0e0e0;
border-radius: 10px;
font-size: 1em;
transition: 0.3s;
box-sizing: border-box;
}
.form-group input:focus, .form-group select:focus {
outline: none;
border-color: var(--primary);
}
.btn-register {
width: 100%;
padding: 14px;
background: var(--primary);
color: white;
border: none;
border-radius: 10px;
font-size: 1.1em;
font-weight: bold;
cursor: pointer;
transition: 0.3s;
margin-top: 10px;
}
.btn-register:hover {
background: var(--secondary);
transform: translateY(-2px);
}
.login-link {
text-align: center;
margin-top: 15px;
font-size: 0.9em;
}
.login-link a {
color: var(--primary);
font-weight: 600;
text-decoration: none;
}
.error-msg {
color: var(--danger);
font-size: 0.85em;
margin-top: 5px;
display: none;
}
.success-msg {
background: #e8f5e9;
color: #2e7d32;
padding: 10px 15px;
border-radius: 8px;
margin-bottom: 15px;
text-align: center;
display: none;
}
.two-cols {
display: flex;
gap: 10px;
}
.two-cols .form-group {
flex: 1;
}
</style>
</head>
<body>

<div class="register-container">
<div class="logo-area">
<i class="fab fa-whatsapp"></i>
<h2>H A D Chat</h2>
<p>Sabuwar Asusanka (Create Account)</p>
</div>

<div class="success-msg" id="successMsg">
<i class="fas fa-check-circle"></i> An yi maka rejista! Ana kai maka dashboard...
</div>

<form id="registerForm" enctype="multipart/form-data">

<div class="profile-photo-area">
<div class="photo-circle" id="photoCircle" onclick="document.getElementById('profilePhoto').click()">
<i class="fas fa-camera" id="photoIcon"></i>
<img id="photoPreview" style="display:none;" alt="Profile">
<input type="file" id="profilePhoto" accept="image/*">
</div>
<div class="photo-hint">Danna don zaɓar hoton profile</div>
</div>

<div class="form-group">
<label>Sunanka (Full Name)</label>
<input type="text" id="fullName" placeholder="Misali: Hassan Abdullahi" required>
</div>

<div class="form-group">
<label>Lamtacin Waya (Phone Number)</label>
<input type="tel" id="phone" placeholder="Misali: 08012345678" required>
</div>

<div class="two-cols">
<div class="form-group">
<label>Jinsi (Gender)</label>
<select id="gender" required>
<option value="">Zabi...</option>
<option value="male">Namiji</option>
<option value="female">Mace</option>
</select>
</div>
<div class="form-group">
<label>Shekaru (Age)</label>
<input type="number" id="age" placeholder="Misali: 25" min="13" max="120" required>
</div>
</div>

<div class="form-group">
<label>Lamtacin Asiri (Password)</label>
<input type="password" id="password" placeholder="Akara lambobin sirri" required>
</div>

<div class="form-group">
<label>Daukar Lamtacin Asiri (Confirm Password)</label>
<input type="password" id="confirmPassword" placeholder="Sake rubuta lambar sirri" required>
</div>

<div class="error-msg" id="errorMsg"></div>

<button type="submit" class="btn-register">
<i class="fas fa-user-plus"></i> Yi Rejista (Register)
</button>
</form>

<div class="login-link">
Kana da asusu? <a href="login.html">Shiga (Login)</a> | <a href="index.html">Kom Gida</a>
</div>
</div>

<script>
// Profile photo preview
document.getElementById('profilePhoto').addEventListener('change', function(e) {
const file = e.target.files[0];
if (file) {
const reader = new FileReader();
reader.onload = function(event) {
const preview = document.getElementById('photoPreview');
preview.src = event.target.result;
preview.style.display = 'block';
document.getElementById('photoIcon').style.display = 'none';
};
reader.readAsDataURL(file);
}
});

// Registration
document.getElementById('registerForm').addEventListener('submit', function(e) {
e.preventDefault();

const fullName = document.getElementById('fullName').value.trim();
const phone = document.getElementById('phone').value.trim();
const gender = document.getElementById('gender').value;
const age = document.getElementById('age').value;
const password = document.getElementById('password').value;
const confirmPassword = document.getElementById('confirmPassword').value;
const photoData = document.getElementById('photoPreview').src;
const errorMsg = document.getElementById('errorMsg');

// Validation
if (password !== confirmPassword) {
errorMsg.textContent = 'Lambobin sirri ba su daidai ba!';
errorMsg.style.display = 'block';
return;
}

if (password.length < 4) {
errorMsg.textContent = 'Lambar sirri ta kamata ta kai akalla haruffa 4!';
errorMsg.style.display = 'block';
return;
}

// Check if phone already registered
const users = JSON.parse(localStorage.getItem('hadchat_users') || '[]');
if (users.find(u => u.phone === phone)) {
errorMsg.textContent = 'Wannan lambar waya an yi rijista da ita!';
errorMsg.style.display = 'block';
return;
}

errorMsg.style.display = 'none';

// Create user
const newUser = {
id: Date.now(),
fullName: fullName,
phone: phone,
gender: gender,
age: age,
password: password,
profilePhoto: photoData !== '' && photoData !== undefined ? photoData : null,
points: 0,
joinedDate: new Date().toISOString(),
isOnline: true
};

users.push(newUser);
localStorage.setItem('hadchat_users', JSON.stringify(users));

// Set current user session
localStorage.setItem('hadchat_currentUser', JSON.stringify(newUser));

// Show success
document.getElementById('successMsg').style.display = 'block';
document.getElementById('registerForm').style.display = 'none';

// Redirect to dashboard
setTimeout(() => {
window.location.href = 'dashboard.html';
}, 1500);
});
</script>

</body>
</html>
