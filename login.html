<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H A D Chat - Shiga (Login)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
--primary: #008069;
--secondary: #00695c;
--dark: #073042;
--text: #333;
--light: #f9f9f9;
--danger: #e53935;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
margin: 0;
padding: 0;
color: var(--text);
line-height: 1.6;
background: linear-gradient(135deg, #e0f7fa 0%, #ffffff 100%);
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
}
.login-container {
max-width: 400px;
width: 90%;
padding: 30px;
background: white;
border-radius: 20px;
box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
.logo-area {
text-align: center;
margin-bottom: 25px;
}
.logo-area i {
font-size: 2.5em;
color: var(--primary);
}
.logo-area h2 {
color: var(--primary);
margin: 10px 0 5px;
}
.form-group {
margin-bottom: 15px;
}
.form-group label {
display: block;
font-weight: 600;
margin-bottom: 5px;
font-size: 0.9em;
}
.form-group input {
width: 100%;
padding: 12px 15px;
border: 2px solid #e0e0e0;
border-radius: 10px;
font-size: 1em;
transition: 0.3s;
box-sizing: border-box;
}
.form-group input:focus {
outline: none;
border-color: var(--primary);
}
.btn-login {
width: 100%;
padding: 14px;
background: var(--primary);
color: white;
border: none;
border-radius: 10px;
font-size: 1.1em;
font-weight: bold;
cursor: pointer;
transition: 0.3s;
margin-top: 5px;
}
.btn-login:hover {
background: var(--secondary);
transform: translateY(-2px);
}
.register-link {
text-align: center;
margin-top: 15px;
font-size: 0.9em;
}
.register-link a {
color: var(--primary);
font-weight: 600;
text-decoration: none;
}
.error-msg {
color: var(--danger);
font-size: 0.85em;
margin-top: 10px;
text-align: center;
display: none;
}
</style>
</head>
<body>

<div class="login-container">
<div class="logo-area">
<i class="fab fa-whatsapp"></i>
<h2>H A D Chat</h2>
<p>Shiga Asusanka (Login)</p>
</div>

<form id="loginForm">
<div class="form-group">
<label>Lamtacin Waya (Phone Number)</label>
<input type="tel" id="loginPhone" placeholder="Misali: 08012345678" required>
</div>

<div class="form-group">
<label>Lamtacin Asiri (Password)</label>
<input type="password" id="loginPassword" placeholder="Lambar sirrinka" required>
</div>

<div class="error-msg" id="loginError"></div>

<button type="submit" class="btn-login">
<i class="fas fa-sign-in-alt"></i> Shiga (Login)
</button>
</form>

<div class="register-link">
Ba ka da asusu? <a href="register.html">Yi Rejista (Register)</a> | <a href="index.html">Kom Gida</a>
</div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
e.preventDefault();

const phone = document.getElementById('loginPhone').value.trim();
const password = document.getElementById('loginPassword').value;
const errorMsg = document.getElementById('loginError');

const users = JSON.parse(localStorage.getItem('hadchat_users') || '[]');
const user = users.find(u => u.phone === phone && u.password === password);

if (!user) {
errorMsg.textContent = 'Lambar waya ko lambar sirri ba daidai ba!';
errorMsg.style.display = 'block';
return;
}

errorMsg.style.display = 'none';

// Set current user session
user.isOnline = true;
localStorage.setItem('hadchat_currentUser', JSON.stringify(user));

// Redirect to dashboard
window.location.href = 'dashboard.html';
});

// Check if already logged in
const currentUser = JSON.parse(localStorage.getItem('hadchat_currentUser') || 'null');
if (currentUser) {
window.location.href = 'dashboard.html';
}
</script>

</body>
</html>
